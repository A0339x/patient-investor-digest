name: Generate Digest

on:
  schedule:
    # Several attempts in the 15 hours before the Monday 9:00am Pacific go-live,
    # because GitHub delays (or drops) scheduled runs. Once the issue exists the
    # later runs are no-ops. Pacific shown for PDT / PST.
    - cron: '0 1 * * 1'   # Sun 6:00pm PDT / 5:00pm PST
    - cron: '0 4 * * 1'   # Sun 9:00pm PDT / 8:00pm PST
    - cron: '0 7 * * 1'   # Mon 12:00am PDT / Sun 11:00pm PST
    - cron: '0 10 * * 1'  # Mon 3:00am PDT / 2:00am PST
    - cron: '0 13 * * 1'  # Mon 6:00am PDT / 5:00am PST
  workflow_dispatch:
    inputs:
      force:
        description: 'Regenerate even if this Monday issue already exists'
        type: boolean
        default: false

# Two generate runs must never overlap (they would both write data.js).
concurrency:
  group: generate-digest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests feedparser

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Generate digest
        run: python scripts/generate_digest.py
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST_STAGE_WEBHOOK_URL: ${{ secrets.DIGEST_STAGE_WEBHOOK_URL }}
          DIGEST_WEBHOOK_SECRET: ${{ secrets.DIGEST_WEBHOOK_SECRET }}
          DIGEST_FORCE: ${{ inputs.force && '1' || '' }}
